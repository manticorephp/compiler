# One Linux target (a tag: arm64, amd64, alpine-arm64, alpine-amd64) as an
# independent pipeline: build the compiler, then run its suite shards — and, for
# the glibc tags, pdo-net and mysqli-net. Called once per tag from ci.yml.
#
# Why a workflow of its own: `needs: build` on a matrix job waits for EVERY leg,
# so with one `build` matrix every shard of every target waited for the slowest
# build. Here `needs: build` is resolved INSIDE one call, i.e. against this tag's
# build only.
#
# The compiler is built ONCE per tag. The suite shards, pdo-net and the seed
# publication take it from the artifact below; gate.sh sees a cache whose
# src.sha is this tree's and reuses it instead of rebuilding (it also runs the
# install/CLI smokes in the build job, once, rather than in every shard).
name: linux-target

on:
  workflow_call:
    inputs:
      tag:
        description: arm64 | amd64 | alpine-arm64 | alpine-amd64 — names the cache key, seed, artifacts, logs
        type: string
        required: true
      runner:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      pdo:
        description: run the pdo-net jobs (glibc tags only)
        type: boolean
        default: false
      mysqli:
        description: run the mysqli-net jobs (glibc tags only)
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The repo's own Dockerfile, `toolchain` target — the same image an end
      # user builds and the same one run_tests.sh builds. php 8.5 + latest clang
      # come from it, so the toolchain is not a CI-only fiction.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: toolchain
          tags: manticore-toolchain:${{ inputs.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ inputs.tag }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ inputs.tag }}

      # ~15 MB: bin/manticore + lib/*.o + lib/prelude. The key is unique per run
      # (a cache entry is immutable), so the restore-keys prefix is what actually
      # hits — the newest entry for this arch and this image definition.
      - name: Restore the compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ci-cache
          key: mc-compiler-${{ inputs.tag }}-${{ hashFiles(inputs.dockerfile) }}-${{ github.run_id }}
          restore-keys: |
            mc-compiler-${{ inputs.tag }}-${{ hashFiles(inputs.dockerfile) }}-

      # Second warm source, reached only when the cache missed — which it does on
      # every Dockerfile change, after a week of not being touched (GitHub evicts
      # it), and on any branch that cannot see main's. The published image does
      # not evict, and it is newer than the pin, so a cache miss does not have to
      # walk up from the last release. A miss here is not an error — `|| true`,
      # and gate.sh falls through to the pinned release.
      - name: Fetch the published compiler
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull -q "$IMAGE:main-${{ inputs.tag }}" 2>/dev/null; then
            cid="$(docker create "$IMAGE:main-${{ inputs.tag }}")"
            mkdir -p ci-seed
            docker cp "$cid:/opt/manticore/bin" ci-seed/bin
            docker cp "$cid:/opt/manticore/lib" ci-seed/lib
            docker rm "$cid" > /dev/null
            chmod -R 777 ci-seed
            echo "seed: $IMAGE:main-${{ inputs.tag }}"
          else
            echo "seed: nothing published for ${{ inputs.tag }} yet — the pinned release it is"
          fi || true

      # /logs and /compiler-cache are mounts the unprivileged container user
      # (uid 1000) must be able to write; /build stays inside the container (the
      # gate copies the tree into it, and that copy has no business crossing a
      # bind mount).
      - name: Build the compiler
        run: |
          # -R, not just the top directory: actions/cache restores the tree as the
          # RUNNER, and the container is uid 1000 — unlinking an entry needs write
          # permission on the directory that holds it, so a restored lib/ is
          # unremovable from inside without this and the cache never updates.
          mkdir -p ci-logs ci-cache ci-seed && chmod -R 777 ci-logs ci-cache ci-seed
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -v "$PWD/ci-seed":/seed:ro \
            -e MC_GATE=0 \
            -e MC_JOBS=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_SEED_DIR=/seed \
            -e MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
            -e MC_SUITE=0 \
            -e MC_XFAIL=0 \
            manticore-toolchain:${{ inputs.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      # A failed smoke on top of a good build still leaves a compiler worth keeping —
      # save before the job's result is decided, not after.
      - name: Save the compiler cache
        if: always() && hashFiles('ci-cache/bin/manticore') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-cache
          key: mc-compiler-${{ inputs.tag }}-${{ hashFiles(inputs.dockerfile) }}-${{ github.run_id }}

      # tar, not the directory: an artifact loses the executable bit.
      - name: Hand the compiler to the other jobs
        run: tar -C ci-cache -cf compiler.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ inputs.tag }}
          path: compiler.tar
          if-no-files-found: error
          retention-days: 3

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-${{ inputs.tag }}
          path: ci-logs/
          if-no-files-found: warn

  # Each target is split into SHARDS slices of the suite (the native runner, --shard i/n;
  # run.sh has the same flag); every slice unpacks the compiler built above and runs 1/N of
  # the cases, so the wall clock is build + suite/N.
  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    needs: build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: toolchain
          tags: manticore-toolchain:${{ inputs.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ inputs.tag }}
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar
      # Shared prelude bodies, each compiled once per variant
      # (docs/design/compile-speed-roadmap.md, E1). Every shard reads the newest
      # cache of its row; shard 1 of a push to main writes it. The objects are
      # keyed by their exact IR, flags and clang, so a stale or foreign entry is
      # a miss, never a wrong object.
      - name: Restore the object cache
        uses: actions/cache/restore@v4
        with:
          path: ci-objcache
          key: mc-objcache-${{ inputs.tag }}-${{ github.run_id }}
          restore-keys: |
            mc-objcache-${{ inputs.tag }}-
      # /logs and /compiler-cache are mounts the unprivileged container user
      # (uid 1000) must be able to write; /build stays inside the container (the
      # gate copies the tree into it, and that copy has no business crossing a
      # bind mount).
      - name: Build + suite
        run: |
          # -R, not just the top directory: actions/cache restores the tree as the
          # RUNNER, and the container is uid 1000 — unlinking an entry needs write
          # permission on the directory that holds it, so a restored lib/ is
          # unremovable from inside without this and the cache never updates.
          mkdir -p ci-logs ci-objcache && chmod -R 777 ci-logs ci-cache ci-objcache
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -v "$PWD/ci-objcache":/objcache \
            -e MANTICORE_OBJ_CACHE_DIR=/objcache \
            -e MANTICORE_OBJ_CACHE_MAX_MB=512 \
            -e MC_GATE=0 \
            -e MC_JOBS=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_SMOKES=0 \
            -e MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
            -e MC_RUNNER=native \
            -e MC_SHARD=${{ matrix.shard }}/4 \
            -e MC_XFAIL=${{ matrix.shard == 1 && 1 || 0 }} \
            manticore-toolchain:${{ inputs.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      # Only the shared bodies travel: the program parts in prog/ are one program
      # each and would fill the repository's cache quota for little reuse.
      - name: Drop the program parts from the object cache
        if: always() && matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo rm -rf ci-objcache/prog
      - name: Save the object cache
        if: always() && matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ci-objcache
          key: mc-objcache-${{ inputs.tag }}-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## linux-${{ inputs.tag }} shard ${{ matrix.shard }}/4 — \`${GITHUB_SHA::12}\`"
            echo '```'
            tail -15 ci-logs/suite.log 2>/dev/null || echo 'no suite log'
            echo '```'
            echo 'known bugs (tests/aot/xfail.sh): an XPASS is a tracked bug this commit fixed — promote its repro and close the issue'
            echo '```'
            grep -E '^(XPASS|xfail:)' ci-logs/xfail.log 2>/dev/null || echo 'no known-bug log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.tag }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn

  # PDO network drivers (pgsql, mysql, mariadb) against live servers, graded
  # against php's own pdo_pgsql / pdo_mysql. The servers run on the runner via
  # tests/pdo_net/up.sh; the toolchain container shares its network (host) and
  # gate.sh stops after the build when MC_PDO_NET is set. Reads the compiler
  # artifact of this tag's build and never writes the cache. glibc tags only.
  pdo-net:
    name: pdo-net-${{ matrix.server }} (${{ matrix.shard }}/4)
    needs: build
    if: inputs.pdo && inputs.dockerfile == 'Dockerfile'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        server: [mysql, mariadb]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: manticore-toolchain:${{ inputs.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ inputs.tag }}
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar

      # postgres 16, mysql 8.4 (plain, TLS, native-password, isolated) and mariadb 11,
      # with the throwaway TLS certificates; then the CA mysql made for itself.
      - name: Start the database servers
        run: |
          bash tests/pdo_net/up.sh
          mkdir -p ci-pdo && docker cp mc-my:/var/lib/mysql/ca.pem ci-pdo/my_ca.pem && chmod -R a+rX ci-pdo tests/pdo_net/.certs

      - name: Build + pdo_net
        run: |
          mkdir -p ci-logs && chmod -R 777 ci-logs ci-cache
          docker run --rm --network host \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -v "$PWD/ci-pdo":/pdo-net:ro \
            -e MC_GATE=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_PDO_NET=${{ matrix.server }} \
            -e MC_PDO_NET_ARGS="${{ matrix.server == 'mariadb' && '--no-pgsql' || '' }} --shard ${{ matrix.shard }}/4" \
            -e PDO_MY_SSL_CA=/pdo-net/my_ca.pem \
            manticore-toolchain:${{ inputs.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pdo-net-${{ inputs.tag }}-${{ matrix.server }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn

  # mysqli against live mysql 8.4 / mariadb 11, graded against php's own mysqli (tests/mysqli_net). Same shape as
  # pdo-net: the servers come from tests/pdo_net/up.sh; gate.sh stops after the build when MC_MYSQLI_NET is set.
  # The server-less surface audit and stub cases run in the suite (tests/aot/cases/mysqli_*).
  mysqli-net:
    name: mysqli-net-${{ matrix.server }} (${{ matrix.shard }}/2)
    needs: build
    if: inputs.mysqli && inputs.dockerfile == 'Dockerfile'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        server: [mysql, mariadb]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: manticore-toolchain:${{ inputs.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ inputs.tag }}
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar

      # up.sh starts every pdo_net server; mysqli_net needs only mysql (mc-my) and mariadb (mc-maria). Its TLS case
      # does not verify the certificate, so no CA is handed to the container.
      - name: Start the database servers
        run: bash tests/pdo_net/up.sh

      - name: Build + mysqli_net
        run: |
          mkdir -p ci-logs && chmod -R 777 ci-logs ci-cache
          docker run --rm --network host \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -e MC_GATE=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_MYSQLI_NET=${{ matrix.server }} \
            -e MC_MYSQLI_NET_ARGS="--shard ${{ matrix.shard }}/2" \
            manticore-toolchain:${{ inputs.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-mysqli-net-${{ inputs.tag }}-${{ matrix.server }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn
