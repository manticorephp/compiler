# Per-push: build the compiler and run the whole AOT suite — Linux on both
# arches under both C libraries (Debian glibc, Alpine musl), and macOS.
#
# The steps are NOT written here. They live in tools/docker/gate.sh, which is
# also what `bash tools/docker/run_tests.sh` runs locally — one definition, so a
# CI green and a local green mean the same thing. This file only supplies a
# machine, the image, the cache and the environment.
#
# BUILD ONCE, TEST IN SLICES. `build-<tag>` / `macos-build` make the compiler and
# hand it on as an artifact; the suite shards, pdo-net and the seed publication
# unpack it (gate.sh sees an up-to-date cache and does not rebuild). Each row's
# suite is cut into 4 shards run in parallel, and `rows` turns the shards back into
# the one check per row that the ruleset requires.
#
# WARM, NOT COLD. The build job restores the compiler it built last time and
# self-hosts from it (`bin/build`), the way a developer does. On a miss it falls
# to the compiler `main` published, then to the PINNED release
# (BOOTSTRAP_VERSION) — never to Zend. A stale cache costs one slow run, never a
# wrong answer; a tree the pin cannot build is a red run that says so, and the
# `bootstrap` job below asks that question on every push.
name: ci

# The line is not "documentation versus everything else", it is "cannot change
# what the build produces". `tools/` is NOT here: gate.sh and install_smoke.sh
# live there and they ARE the test. Neither is `install.sh`, nor any Dockerfile,
# nor the workflows themselves. A push that touches a listed path AND a real one
# still runs — paths-ignore only skips when every changed file matches.
#
# The cost of getting this wrong is asymmetric: a skipped run over a doc edit
# saves ~20 runner-minutes, while a skipped run over a build script means the
# next person to touch code inherits someone else's untested change.
# examples/symfony-* are standalone Composer apps (nothing in tests/ or tools/ builds them); examples/http and
# examples/async ARE inputs of tests/ir_budget, so they stay out of this list.
# A PR is filtered only for **.md, docs/** and site/** (ci-docs-only.yml reports the required names instead). The suite rows and bootstrap-from-pin are
# REQUIRED status checks on main (ruleset "Protected branches"), and a required
# check a skipped workflow never reports leaves the PR unmergeable for ever.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/symfony-*/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.claude/**'
      - 'site/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# A newer push supersedes a PR run, but never a main run: a cancelled main build
# never saves its compiler cache, and a stale cache makes every PR rebuild the
# compiler from scratch (two generations, ~15 min) instead of reusing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: version-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: COMPILER_VERSION is consistent
        run: bash tools/check_version.sh

  # The compiler is built ONCE per tag. The suite shards, pdo-net and the seed
  # publication take it from the artifact below; gate.sh sees a cache whose
  # src.sha is this tree's and reuses it instead of rebuilding (it also runs the
  # install/CLI smokes here, once, rather than in every shard).
  build:
    name: build-${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # glibc (Debian) and musl (Alpine), each on both arches. `tag` names what a
      # row reads and writes — cache key, published seed, logs — so a glibc
      # compiler never reaches a musl container: the loader would refuse it, and
      # a refusal is not a diagnosis.
      matrix:
        include:
          - {tag: arm64, runner: ubuntu-24.04-arm, dockerfile: Dockerfile}
          - {tag: amd64, runner: ubuntu-latest, dockerfile: Dockerfile}
          - {tag: alpine-arm64, runner: ubuntu-24.04-arm, dockerfile: Dockerfile.alpine}
          - {tag: alpine-amd64, runner: ubuntu-latest, dockerfile: Dockerfile.alpine}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The repo's own Dockerfile, `toolchain` target — the same image an end
      # user builds and the same one run_tests.sh builds. php 8.5 + latest clang
      # come from it, so the toolchain is not a CI-only fiction.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: toolchain
          tags: manticore-toolchain:${{ matrix.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.tag }}

      # ~15 MB: bin/manticore + lib/*.o + lib/prelude. The key is unique per run
      # (a cache entry is immutable), so the restore-keys prefix is what actually
      # hits — the newest entry for this arch and this image definition.
      - name: Restore the compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ci-cache
          key: mc-compiler-${{ matrix.tag }}-${{ hashFiles(matrix.dockerfile) }}-${{ github.run_id }}
          restore-keys: |
            mc-compiler-${{ matrix.tag }}-${{ hashFiles(matrix.dockerfile) }}-

      # Second warm source, reached only when the cache missed — which it does on
      # every Dockerfile change, after a week of not being touched (GitHub evicts
      # it), and on any branch that cannot see main's. The published image does
      # not evict, and it is newer than the pin, so a cache miss does not have to
      # walk up from the last release. A miss here is not an error — `|| true`,
      # and gate.sh falls through to the pinned release.
      - name: Fetch the published compiler
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull -q "$IMAGE:main-${{ matrix.tag }}" 2>/dev/null; then
            cid="$(docker create "$IMAGE:main-${{ matrix.tag }}")"
            mkdir -p ci-seed
            docker cp "$cid:/opt/manticore/bin" ci-seed/bin
            docker cp "$cid:/opt/manticore/lib" ci-seed/lib
            docker rm "$cid" > /dev/null
            chmod -R 777 ci-seed
            echo "seed: $IMAGE:main-${{ matrix.tag }}"
          else
            echo "seed: nothing published for ${{ matrix.tag }} yet — the pinned release it is"
          fi || true

      # /logs and /compiler-cache are mounts the unprivileged container user
      # (uid 1000) must be able to write; /build stays inside the container (the
      # gate copies the tree into it, and that copy has no business crossing a
      # bind mount).
      - name: Build the compiler
        run: |
          # -R, not just the top directory: actions/cache restores the tree as the
          # RUNNER, and the container is uid 1000 — unlinking an entry needs write
          # permission on the directory that holds it, so a restored lib/ is
          # unremovable from inside without this and the cache never updates.
          mkdir -p ci-logs ci-cache ci-seed && chmod -R 777 ci-logs ci-cache ci-seed
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -v "$PWD/ci-seed":/seed:ro \
            -e MC_GATE=0 \
            -e MC_JOBS=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_SEED_DIR=/seed \
            -e MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
            -e MC_SUITE=0 \
            -e MC_XFAIL=0 \
            manticore-toolchain:${{ matrix.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      # A failed smoke on top of a good build still leaves a compiler worth keeping —
      # save before the job's result is decided, not after.
      - name: Save the compiler cache
        if: always() && hashFiles('ci-cache/bin/manticore') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-cache
          key: mc-compiler-${{ matrix.tag }}-${{ hashFiles(matrix.dockerfile) }}-${{ github.run_id }}

      # tar, not the directory: an artifact loses the executable bit.
      - name: Hand the compiler to the other jobs
        run: tar -C ci-cache -cf compiler.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.tag }}
          path: compiler.tar
          if-no-files-found: error
          retention-days: 3

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-${{ matrix.tag }}
          path: ci-logs/
          if-no-files-found: warn

  linux:
    name: linux-${{ matrix.tag }} (${{ matrix.shard }}/4)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    needs: build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # glibc (Debian) and musl (Alpine), each on both arches. `tag` names what a
      # row reads and writes — cache key, published seed, logs — so a glibc
      # compiler never reaches a musl container: the loader would refuse it, and
      # a refusal is not a diagnosis.
      # Each row is split into SHARDS slices of the suite (the native runner, --shard i/n;
      # run.sh has the same flag); every slice builds the compiler itself — warm, from the
      # cache — and runs 1/N of the cases, so the wall clock is build + suite/N.
      matrix:
        row: [arm64, amd64, alpine-arm64, alpine-amd64]
        shard: [1, 2, 3, 4]
        include:
          - row: arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            tag: arm64
            dockerfile: Dockerfile
          - row: amd64
            arch: amd64
            runner: ubuntu-latest
            tag: amd64
            dockerfile: Dockerfile
          - row: alpine-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            tag: alpine-arm64
            dockerfile: Dockerfile.alpine
          - row: alpine-amd64
            arch: amd64
            runner: ubuntu-latest
            tag: alpine-amd64
            dockerfile: Dockerfile.alpine
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The repo's own Dockerfile, `toolchain` target — the same image an end
      # user builds and the same one run_tests.sh builds. php 8.5 + latest clang
      # come from it, so the toolchain is not a CI-only fiction.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: toolchain
          tags: manticore-toolchain:${{ matrix.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.tag }}
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar
      # /logs and /compiler-cache are mounts the unprivileged container user
      # (uid 1000) must be able to write; /build stays inside the container (the
      # gate copies the tree into it, and that copy has no business crossing a
      # bind mount).
      - name: Build + suite
        run: |
          # -R, not just the top directory: actions/cache restores the tree as the
          # RUNNER, and the container is uid 1000 — unlinking an entry needs write
          # permission on the directory that holds it, so a restored lib/ is
          # unremovable from inside without this and the cache never updates.
          mkdir -p ci-logs && chmod -R 777 ci-logs ci-cache
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -e MC_GATE=0 \
            -e MC_JOBS=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_SMOKES=0 \
            -e MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
            -e MC_RUNNER=native \
            -e MC_SHARD=${{ matrix.shard }}/4 \
            -e MC_XFAIL=${{ matrix.shard == 1 && 1 || 0 }} \
            manticore-toolchain:${{ matrix.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## linux-${{ matrix.tag }} shard ${{ matrix.shard }}/4 — \`${GITHUB_SHA::12}\`"
            echo '```'
            tail -15 ci-logs/suite.log 2>/dev/null || echo 'no suite log'
            echo '```'
            echo 'known bugs (tests/aot/xfail.sh): an XPASS is a tracked bug this commit fixed — promote its repro and close the issue'
            echo '```'
            grep -E '^(XPASS|xfail:)' ci-logs/xfail.log 2>/dev/null || echo 'no known-bug log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.tag }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn

  macos-build:
    name: macos-build
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Homebrew's `php` is the difftest oracle; the build never touches it — a
      # cache miss starts from the pinned release (BOOTSTRAP_VERSION).
      - name: Toolchain
        run: |
          brew install php pcre2 openssl@3 sqlite icu4c
          php -v
          clang --version | head -1

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ci-cache
          key: mc-compiler-macos-arm64-${{ github.run_id }}
          restore-keys: |
            mc-compiler-macos-arm64-

      # The same gate.sh, run bare: it copies the checkout to a scratch tree
      # (RUNNER_TEMP, never the checkout itself — the build writes bin/ and lib/
      # into whatever it is pointed at) and does the same steps the container does.
      - name: Build the compiler
        run: |
          mkdir -p ci-logs ci-cache
          MC_GATE=0 \
          MC_SUITE=0 \
          MC_XFAIL=0 \
          MC_REPO="$PWD" \
          MC_WORK="$RUNNER_TEMP/build" \
          MC_LOGDIR="$PWD/ci-logs" \
          MC_COMPILER_CACHE="$PWD/ci-cache" \
          MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
          bash tools/docker/gate.sh

      - name: Save the compiler cache
        if: always() && hashFiles('ci-cache/bin/manticore') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-cache
          key: mc-compiler-macos-arm64-${{ github.run_id }}

      - name: Hand the compiler to the shards
        run: tar -C ci-cache -cf compiler.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-macos-arm64
          path: compiler.tar
          if-no-files-found: error
          retention-days: 3

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-build-macos-arm64
          path: ci-logs/
          if-no-files-found: warn

  macos:
    name: macos-arm64 (${{ matrix.shard }}/4)
    runs-on: macos-15
    needs: macos-build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # Homebrew's `php` is the difftest oracle; the build never touches it — a
      # cache miss starts from the pinned release (BOOTSTRAP_VERSION).
      - name: Toolchain
        run: |
          brew install php pcre2 openssl@3 sqlite icu4c
          php -v
          clang --version | head -1

      - uses: actions/download-artifact@v4
        with:
          name: compiler-macos-arm64
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar
      # The same gate.sh, run bare: it copies the checkout to a scratch tree
      # (RUNNER_TEMP, never the checkout itself — the build writes bin/ and lib/
      # into whatever it is pointed at) and does the same steps the container does.
      - name: Build + suite
        run: |
          mkdir -p ci-logs
          MC_GATE=0 \
          MC_JOBS=0 \
          MC_SMOKES=0 \
          MC_RUNNER=native \
          MC_SHARD="${{ matrix.shard }}/4" \
          MC_XFAIL="${{ matrix.shard == 1 && 1 || 0 }}" \
          MC_REPO="$PWD" \
          MC_WORK="$RUNNER_TEMP/build" \
          MC_LOGDIR="$PWD/ci-logs" \
          MC_COMPILER_CACHE="$PWD/ci-cache" \
          MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
          bash tools/docker/gate.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## macos-arm64 shard ${{ matrix.shard }}/4 — \`${GITHUB_SHA::12}\`"
            echo '```'
            tail -15 ci-logs/suite.log 2>/dev/null || echo 'no suite log'
            echo '```'
            echo 'known bugs (tests/aot/xfail.sh): an XPASS is a tracked bug this commit fixed — promote its repro and close the issue'
            echo '```'
            grep -E '^(XPASS|xfail:)' ci-logs/xfail.log 2>/dev/null || echo 'no known-bug log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-macos-arm64-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn

  # A PR runs pdo-net only when it touches what the drivers are made of; every
  # push to main (and a manual run) runs it regardless, so a compiler change that
  # breaks a driver is caught there. pdo-net is not a required check, so a skipped
  # row blocks nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pdo: ${{ steps.f.outputs.pdo }}
      mysqli: ${{ steps.f.outputs.mysqli }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pdo=false
          mysqli=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            files="$(gh pr diff "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --name-only)"
            if echo "$files" | grep -qE '^(prelude/pdo|tests/pdo_net/|tools/docker/gate\.sh|\.github/workflows/ci\.yml)'; then pdo=true; fi
            if echo "$files" | grep -qE '^(prelude/(mysqli|pdo_mysql)|tests/mysqli_net/|tests/pdo_net/up\.sh|tools/mysqli_surface_audit\.php|tools/docker/gate\.sh|\.github/workflows/ci\.yml)'; then mysqli=true; fi
          fi
          echo "pdo=$pdo" >> "$GITHUB_OUTPUT"
          echo "mysqli=$mysqli" >> "$GITHUB_OUTPUT"

  # PDO network drivers (pgsql, mysql, mariadb) against live servers, graded
  # against php's own pdo_pgsql / pdo_mysql. The servers run on the runner via
  # tests/pdo_net/up.sh; the toolchain container shares its network (host) and
  # gate.sh stops after the build when MC_PDO_NET is set. Reads the compiler
  # cache of the `linux` rows and never writes it.
  pdo-net:
    name: pdo-net-${{ matrix.tag }}-${{ matrix.server }} (${{ matrix.shard }}/4)
    needs: [changes, build]
    if: github.event_name != 'pull_request' || needs.changes.outputs.pdo == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tag: [arm64, amd64]
        server: [mysql, mariadb]
        shard: [1, 2, 3, 4]
        include:
          - tag: arm64
            runner: ubuntu-24.04-arm
          - tag: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: manticore-toolchain:${{ matrix.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.tag }}
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar

      # postgres 16, mysql 8.4 (plain, TLS, native-password, isolated) and mariadb 11,
      # with the throwaway TLS certificates; then the CA mysql made for itself.
      - name: Start the database servers
        run: |
          bash tests/pdo_net/up.sh
          mkdir -p ci-pdo && docker cp mc-my:/var/lib/mysql/ca.pem ci-pdo/my_ca.pem && chmod -R a+rX ci-pdo tests/pdo_net/.certs

      - name: Build + pdo_net
        run: |
          mkdir -p ci-logs && chmod -R 777 ci-logs ci-cache
          docker run --rm --network host \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -v "$PWD/ci-pdo":/pdo-net:ro \
            -e MC_GATE=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_PDO_NET=${{ matrix.server }} \
            -e MC_PDO_NET_ARGS="${{ matrix.server == 'mariadb' && '--no-pgsql' || '' }} --shard ${{ matrix.shard }}/4" \
            -e PDO_MY_SSL_CA=/pdo-net/my_ca.pem \
            manticore-toolchain:${{ matrix.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pdo-net-${{ matrix.tag }}-${{ matrix.server }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn

  # mysqli against live mysql 8.4 / mariadb 11, graded against php's own mysqli (tests/mysqli_net). Same shape as
  # pdo-net: the servers come from tests/pdo_net/up.sh; gate.sh stops after the build when MC_MYSQLI_NET is set.
  # The server-less surface audit and stub cases run in the suite (tests/aot/cases/mysqli_*).
  mysqli-net:
    name: mysqli-net-${{ matrix.tag }}-${{ matrix.server }} (${{ matrix.shard }}/4)
    needs: [changes, build]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mysqli == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tag: [arm64, amd64]
        server: [mysql, mariadb]
        shard: [1, 2, 3, 4]
        include:
          - tag: arm64
            runner: ubuntu-24.04-arm
          - tag: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: manticore-toolchain:${{ matrix.tag }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.tag }}
      - name: Unpack the compiler
        run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar

      # postgres 16, mysql 8.4 (plain, TLS, native-password, isolated) and mariadb 11,
      # with the throwaway TLS certificates; then the CA mysql made for itself.
      - name: Start the database servers
        run: |
          bash tests/pdo_net/up.sh
          mkdir -p ci-pdo && docker cp mc-my:/var/lib/mysql/ca.pem ci-pdo/my_ca.pem && chmod -R a+rX ci-pdo tests/pdo_net/.certs

      - name: Build + mysqli_net
        run: |
          mkdir -p ci-logs && chmod -R 777 ci-logs ci-cache
          docker run --rm --network host \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -v "$PWD/ci-cache":/compiler-cache \
            -v "$PWD/ci-pdo":/mysqli-net:ro \
            -e MC_GATE=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMPILER_CACHE=/compiler-cache \
            -e MC_MYSQLI_NET=${{ matrix.server }} \
            -e MC_MYSQLI_NET_ARGS="--shard ${{ matrix.shard }}/4" \
            -e PDO_MY_SSL_CA=/mysqli-net/my_ca.pem \
            manticore-toolchain:${{ matrix.tag }} \
            /bin/bash /repo/tools/docker/gate.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-mysqli-net-${{ matrix.tag }}-${{ matrix.server }}-${{ matrix.shard }}
          path: ci-logs/
          if-no-files-found: warn

  # The bootstrap rule, checked on every push: this tree must build from the
  # PINNED release alone — no cache, no published `main`, no Zend. A merge that
  # uses a feature newer than BOOTSTRAP_VERSION goes red HERE, while every other
  # row may still be green off a newer cached compiler. Release the feature and
  # raise the pin first. One row is enough: the gap (a builtin, syntax, a trap)
  # is a property of the source, not of the platform. No suite — gate.sh with
  # MC_SUITE=0 builds two generations and runs the install smokes.
  bootstrap:
    name: bootstrap-from-pin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: manticore-toolchain:arm64
          load: true
          cache-from: type=gha,scope=toolchain-arm64
      - name: Build from BOOTSTRAP_VERSION
        run: |
          mkdir -p ci-logs && chmod -R 777 ci-logs
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -e MC_SUITE=0 \
            -e MC_XFAIL=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
            manticore-toolchain:arm64 \
            /bin/bash /repo/tools/docker/gate.sh
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-bootstrap
          path: ci-logs/
          if-no-files-found: warn

  # `:main` as one multi-arch tag, from the two the jobs above pushed. Merged by
  # digest — nothing is rebuilt and nothing is emulated, and `docker pull
  # ghcr.io/manticorephp/compiler:main` resolves to the right architecture.
  # One check per row, under the name the "Protected branches" ruleset requires
  # (linux-arm64, …, macos-arm64): green only when EVERY shard of that row is. The
  # shard count can change without touching the ruleset.
  rows:
    name: ${{ matrix.row }}
    needs: [linux, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        row: [linux-arm64, linux-amd64, linux-alpine-arm64, linux-alpine-amd64, macos-arm64]
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("${{ matrix.row }} (")) | "\(.conclusion)\t\(.name)"')"
          echo "$jobs"
          [ "$(echo "$jobs" | grep -c .)" = 4 ] || { echo "expected 4 shards"; exit 1; }
          ! echo "$jobs" | grep -qv '^success'

  # What the suite just passed, published as the seed — once per tag, after EVERY
  # shard of every row is green: a red slice never reaches here, so what is
  # published is always a compiler that passed the whole suite.
  publish:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: publish-${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {tag: arm64, runner: ubuntu-24.04-arm, dockerfile: Dockerfile}
          - {tag: amd64, runner: ubuntu-latest, dockerfile: Dockerfile}
          - {tag: alpine-arm64, runner: ubuntu-24.04-arm, dockerfile: Dockerfile.alpine}
          - {tag: alpine-amd64, runner: ubuntu-latest, dockerfile: Dockerfile.alpine}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.tag }}
      - run: mkdir ci-cache && tar -C ci-cache -xf compiler.tar && rm compiler.tar
      # From the artifacts the shards already have — NOT a second compiler built
      # from the pin (the root Dockerfile's `runtime` target).
      - name: Publish this compiler as the seed
        run: |
          docker build --target base -t manticore-base:local -f ${{ matrix.dockerfile }} .
          docker build -f tools/docker/Dockerfile.publish \
            --build-arg BASE=manticore-base:local \
            -t "$IMAGE:main-${{ matrix.tag }}" \
            -t "$IMAGE:${GITHUB_SHA::12}-${{ matrix.tag }}" \
            ci-cache
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:main-${{ matrix.tag }}"
          docker push "$IMAGE:${GITHUB_SHA::12}-${{ matrix.tag }}"

  seed-manifest:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Merge
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:main" \
            "$IMAGE:main-arm64" "$IMAGE:main-amd64"
          docker buildx imagetools create -t "$IMAGE:${GITHUB_SHA::12}" \
            "$IMAGE:${GITHUB_SHA::12}-arm64" "$IMAGE:${GITHUB_SHA::12}-amd64"
          docker buildx imagetools create -t "$IMAGE:main-alpine" \
            "$IMAGE:main-alpine-arm64" "$IMAGE:main-alpine-amd64"
          docker buildx imagetools create -t "$IMAGE:${GITHUB_SHA::12}-alpine" \
            "$IMAGE:${GITHUB_SHA::12}-alpine-arm64" "$IMAGE:${GITHUB_SHA::12}-alpine-amd64"
          docker buildx imagetools inspect "$IMAGE:main"
