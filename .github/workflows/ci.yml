# Per-push smoke: cold Zend seed + the whole AOT suite, on both Linux arches.
#
# The steps are NOT written here. They live in tools/docker/gate.sh, which is
# also what `bash tools/docker/run_tests.sh` runs locally — one definition, so a
# CI green and a local green mean the same thing. This file only supplies a
# machine, the image, and the environment.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The repo's own Dockerfile, `toolchain` target — the same image an end
      # user builds and the same one run_tests.sh builds. php 8.5 + latest clang
      # come from it, so the toolchain is not a CI-only fiction.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          tags: manticore-toolchain:${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.arch }}

      # /logs is a mount the unprivileged container user must be able to write;
      # /build stays inside the container (the gate copies the tree into it, and
      # that copy has no business crossing a bind mount).
      - name: Seed + suite
        run: |
          mkdir -p ci-logs && chmod 777 ci-logs
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$PWD/ci-logs":/logs \
            -e MC_GATE=0 \
            -e MC_JOBS=0 \
            -e MC_LOGDIR=/logs \
            -e MC_COMMIT="${GITHUB_SHA::12} ${GITHUB_REF_NAME}" \
            manticore-toolchain:${{ matrix.arch }} \
            /bin/bash /repo/tools/docker/gate.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: ci-logs/
          if-no-files-found: warn
